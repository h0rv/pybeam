[project]
name = "python-beam"
version = "0.1.0a1"
description = "Python-first tools for BEAM services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
pybeam = "pybeam.runtime.cli:main"

[project.optional-dependencies]
genstage = []
showcase = [
    "fastapi==0.163.0",
    "jinja2>=3.1.6,<4",
    "uvicorn>=0.41,<1",
]
hornbeam = ["hornbeam"]
fastapi = [
    "fastapi==0.163.0",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn==0.54.0",
]
litestar = [
    "litestar[jinja]==2.25.0",
    "pydantic==2.14.3",
]
pyview = [
    "python-multipart>=0.0.20,<1",
    "pyview-web>=0.9.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "hypothesis>=6,<7",
  "ruff>=0.14,<1",
  "httpx>=0.28,<1",
  "websockets>=15,<17",
  "pydantic==2.14.3",
  "ty>=0.0.104",
  "typing-extensions>=4.14.1,<5",
  "psutil>=7,<8",
  "types-psutil>=7,<8",
  "playwright>=1.58,<2",
  "hatchling>=1.27,<2",
  "patchelf==0.19.3.0 ; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
backend-path = [".", "src"]

[tool.hatch.build.hooks.custom]
path = "tools/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pybeam"]
exclude = ["src/pybeam/integrations/genstage/*.erl", "src/pybeam/integrations/genstage/*.ex", "src/pybeam/integrations/genstage/*.app"]

[tool.hatch.build.targets.sdist]
include = ["src/pybeam", "tools", "pyproject.toml", "README.md"]

[tool.uv.sources]
hornbeam = { git = "https://github.com/h0rv/hornbeam.git", rev = "034fde051eb177a36afc3ceca9e59d447a90e2cf" }
pyview-web = { git = "https://github.com/ogrodnek/pyview.git", rev = "d29dda1fb1f3a09c3c0a3c9102a8f0490f6f9972" }

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["typings", ".", "examples/docs"]

[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["src", "tests", "examples", "tools"]
exclude = ["examples/chat_load/conventional", "examples/fastapi_celery/original"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["examples/fastapi_celery/original"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "I", "B", "ASYNC", "UP", "C4", "DTZ",
  "TID", "PLE", "PLW", "RUF", "SIM", "ANN", "S",
]
ignore = ["UP031", "UP032"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pyview.Depends"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"tests/test_runtime_native.py" = ["S101", "ASYNC110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "runtime: requires a built BEAM runtime",
    "browser: explicitly requested real Chromium acceptance",
    "benchmark: guarded real load; requires --run-benchmarks and an exclusive measurement window",
]
