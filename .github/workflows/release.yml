name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - tools/build_native.py
      - tools/build_runtime.py
      - tools/hatch_build.py
      - tools/runtime_wheel.py
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.8'
          python-version: '3.14.10'
      - name: Check release version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(uv version --short)" = "$TAG"
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel:
    name: wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported glibc; the wheel tag records what it needs.
          - target: linux-x86_64
            runner: ubuntu-22.04
          # GitHub's macOS 27 arm64 preview image is named xcode-27, not macos-27.
          - target: macos-arm64
            runner: xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pybeam
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      ERL_FLAGS: '+S 2:2 +A 2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: pybeam
          persist-credentials: false
      - name: Configure Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libssl-dev patchelf zlib1g-dev
          # Static OpenSSL and no termcap keep the runtime on manylinux system libraries.
          echo "MISE_ALL_COMPILE=true" >> "$GITHUB_ENV"
          echo "KERL_CONFIGURE_OPTIONS=--disable-dynamic-ssl-lib --without-termcap --without-javac --without-wx --without-odbc" >> "$GITHUB_ENV"
      - name: Configure macOS toolchain
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          brew list openssl@3 >/dev/null || brew install openssl@3
          echo "KERL_CONFIGURE_OPTIONS=--disable-dynamic-ssl-lib --without-javac --without-wx --with-ssl=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v3
        with:
          working_directory: pybeam
      - name: Resolve locked runtime pin
        id: pins
        run: |
          native_ref=$(erl -noshell -eval '
            {ok, [Locks]} = file:consult("rebar.lock"),
            {_, {git, _, {ref, Ref}}, _} = lists:keyfind(<<"erlang_python">>, 1, Locks),
            io:put_chars(Ref), halt().')
          hornbeam_ref=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("uv.lock").read_text())
          package = next(item for item in lock["package"] if item["name"] == "hornbeam")
          print(package["source"]["git"].rsplit("#", 1)[1])
          PY
          )
          [[ "$native_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$hornbeam_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "erlang_python=$native_ref" >> "$GITHUB_OUTPUT"
          echo "hornbeam=$hornbeam_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: h0rv/erlang-python
          ref: ${{ steps.pins.outputs.erlang_python }}
          path: erlang-python
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: h0rv/hornbeam
          ref: ${{ steps.pins.outputs.hornbeam }}
          path: hornbeam
          persist-credentials: false
      - name: Build pinned native runtime
        run: |
          uv sync --locked --all-extras --python "$(mise which python)"
          mkdir -p _checkouts
          ln -s ../../erlang-python _checkouts/erlang_python
          ln -s ../../hornbeam _checkouts/hornbeam
          uv run --locked --all-extras python tools/build_native.py
      - name: Stage runtime assets
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/erlang/otp/OTP-29.1.2/LICENSE.txt \
            --output "$RUNNER_TEMP/OTP-LICENSE.txt"
          uv run --locked python tools/build_runtime.py \
            --otp-root "$(mise where erlang)" \
            --native-app _build/hornbeam/checkouts/erlang_python \
            --otp-license "$RUNNER_TEMP/OTP-LICENSE.txt" \
            --native-license ../erlang-python/LICENSE
      - name: Build wheel
        run: uv build --wheel
      - name: Verify clean wheel install
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          PYBEAM_TEST_WHEEL="$PWD/${wheels[0]}" uv run --locked pytest \
            tests/test_packaging.py tests/test_optional_wheel_imports.py \
            --run-runtime -q --basetemp="$RUNNER_TEMP/wheel-tests"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: pybeam/dist/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [sdist, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/python-beam/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
