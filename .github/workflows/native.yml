name: Native CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    # GitHub's macOS 27 arm64 preview image is named xcode-27, not macos-27.
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pybeam
        shell: bash
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      ERL_FLAGS: '+S 2:2 +A 2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: pybeam
          persist-credentials: false
      - name: Verify host and configure toolchain
        id: host
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
          brew list openssl@3 >/dev/null || brew install openssl@3
          echo "KERL_CONFIGURE_OPTIONS=--disable-dynamic-ssl-lib --without-javac --without-wx --with-ssl=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v3
        with:
          working_directory: pybeam
      - name: Resolve locked runtime pins
        id: pins
        run: |
          native_ref=$(erl -noshell -eval '
            {ok, [Locks]} = file:consult("rebar.lock"),
            {_, {git, _, {ref, Ref}}, _} = lists:keyfind(<<"erlang_python">>, 1, Locks),
            io:put_chars(Ref), halt().')
          hornbeam_ref=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("uv.lock").read_text())
          package = next(item for item in lock["package"] if item["name"] == "hornbeam")
          print(package["source"]["git"].rsplit("#", 1)[1])
          PY
          )
          [[ "$native_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$hornbeam_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "erlang_python=$native_ref" >> "$GITHUB_OUTPUT"
          echo "hornbeam=$hornbeam_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: h0rv/erlang-python
          ref: ${{ steps.pins.outputs.erlang_python }}
          path: erlang-python
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: h0rv/hornbeam
          ref: ${{ steps.pins.outputs.hornbeam }}
          path: hornbeam
          persist-credentials: false
      - name: Install locked Python dependencies
        run: |
          uv sync --locked --all-extras --python "$(mise which python)"
          uv pip install --python .venv/bin/python --no-deps pytest-timeout==2.4.0
      - name: Link pinned sibling sources
        run: |
          mkdir -p _checkouts
          ln -s ../../erlang-python _checkouts/erlang_python
          ln -s ../../hornbeam _checkouts/hornbeam
      - name: Restore native build
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            pybeam/_build
            erlang-python/ebin
            erlang-python/priv/py_nif.so
            hornbeam/ebin
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.host.outputs.image }}-${{ steps.pins.outputs.erlang_python }}-${{ steps.pins.outputs.hornbeam }}-${{ hashFiles('pybeam/mise.toml', 'pybeam/rebar.config', 'pybeam/rebar.lock', 'pybeam/tools/build_native.py', 'pybeam/.github/workflows/native.yml') }}
      - name: Build pinned native runtime
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: uv run --locked --all-extras python tools/build_native.py
      - name: Stage managed runtime assets
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/erlang/otp/OTP-29.1.2/LICENSE.txt \
            --output "$RUNNER_TEMP/OTP-LICENSE.txt"
          uv run --locked --all-extras python tools/build_runtime.py \
            --otp-root "$(mise where erlang)" \
            --native-app _build/hornbeam/checkouts/erlang_python \
            --otp-license "$RUNNER_TEMP/OTP-LICENSE.txt" \
            --native-license ../erlang-python/LICENSE \
            --hornbeam-app _build/hornbeam/checkouts/hornbeam \
            --hornbeam-license ../hornbeam/LICENSE \
            --output src/pybeam/runtime/_assets
      - name: Native regression suites
        # Browser acceptance needs Chromium; benchmark loads need an exclusive window.
        # Deselected release gates need a reviewed platform wheel with GenStage
        # and an exact-byte prepared distribution profile, not this source build.
        run: |
          fails=0
          for i in $(seq 1 15); do
            uv run --locked --all-extras pytest --run-frameworks --run-runtime -q -s \
              "tests/test_runtime_native.py::test_native__nonreading_output_peer_closes_and_releases_subscription" \
              --basetemp="$RUNNER_TEMP/native-tests-$i" 2>&1 | grep -E "DIAG|passed|failed|Error" || true
            [ "${PIPESTATUS[0]}" = 0 ] || fails=$((fails+1))
          done
          echo "fails=$fails"
          exit 1
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-regression-logs
          path: |
            ${{ runner.temp }}/native-tests
            pybeam/erl_crash.dump
          if-no-files-found: ignore
