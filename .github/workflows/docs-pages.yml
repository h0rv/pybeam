name: Documentation Pages

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'site/**'
      - 'src/**'
      - 'typings/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mise.toml'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'site/**'
      - 'src/**'
      - 'typings/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mise.toml'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      origin: ${{ steps.pages.outputs.origin }}
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      # Pages must already be enabled with build_type=workflow by a repository admin.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
        with:
          enablement: false

  build:
    needs: pages
    if: ${{ !cancelled() && (needs.pages.result == 'success' || needs.pages.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Match the task-scoped Node pin in mise.toml without installing Python or OTP.
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Test and build at the root
        run: npm test && npm run build
        env:
          DOCS_BASE: /
      - name: Test and build at the project path
        run: npm test && npm run build
        env:
          DOCS_BASE: /pybeam/
      - name: Build for the configured Pages URL
        if: needs.pages.result == 'success'
        run: npm run build
        env:
          DOCS_SITE: ${{ needs.pages.outputs.origin }}
          DOCS_BASE: ${{ format('{0}/', needs.pages.outputs.base_path) }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
