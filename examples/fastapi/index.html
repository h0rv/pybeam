<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared PyBEAM counter · FastAPI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', path='missing.min.css') }}">
  <style>
    #count { display: block; font-size: 3rem; font-weight: bold; line-height: 1.2; }
    form { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem; }
    input[type="number"] { inline-size: 5rem; }
  </style>
  <script src="{{ url_for('static', path='htmx.min.js') }}"></script>
  <script src="{{ url_for('static', path='sse.js') }}"></script>
</head>
<body>
<main>
  <header>
    <h1>Shared counter</h1>
    <p>Increment in one tab and watch the count in both tabs.</p>
    <p><a href="{{ url_for('index') }}" target="_blank" rel="noopener">Open a second tab</a></p>
  </header>
  <section aria-labelledby="counter-heading">
    <h2 id="counter-heading">Count</h2>
    <div id="counter-region" hx-sse:connect="{{ url_for('events') }}" hx-swap="innerHTML" aria-live="polite">
      {% include 'counter.html' %}
    </div>
    <form action="{{ url_for('increment') }}" method="post"
          hx-post="{{ url_for('increment') }}" hx-target="#confirmation" hx-swap="innerHTML">
      <label>Amount <input name="amount" type="number" min="1" max="10" value="1" required></label>
      <button type="submit">Increment</button>
    </form>
    <p id="confirmation" role="status"></p>
    <p><a href="{{ url_for('counter') }}">Read current count</a></p>
  </section>
  <p>Everyone on this server shares the count. Restarting the server resets it.
     This demo has no authentication.</p>
</main>
</body>
</html>
