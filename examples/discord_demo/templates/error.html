<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Room action rejected</title><link rel="stylesheet" href="{{ origin }}/static/missing.min.css"></head>
<body><main>
  <h1>This request was rejected.</h1>
  <p>No room change was made by this request.</p>
  <p>Open the local address below and try there. Do not resend a message if you already see it in the room.</p>
  <a href="{{ origin }}/rooms/general">Open {{ origin }}</a>
  <details><summary>Request details</summary><p>{{ message }}</p></details>
</main></body>
</html>
