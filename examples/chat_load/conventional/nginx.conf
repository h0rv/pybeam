events {
    worker_connections 16384;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream sticky {
        hash $arg_client consistent;
        server app-1:8000;
        server app-2:8000;
    }

    upstream any {
        server app-1:8000;
        server app-2:8000;
        keepalive 64;
    }

    server {
        listen 8801;
        access_log off;

        location ~ ^/rooms/[^/]+/ws$ {
            proxy_pass http://sticky;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        location / {
            proxy_pass http://any;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
