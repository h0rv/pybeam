<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live FastAPI chat</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f5f7; color: #172536; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 100rem; height: 100dvh; margin: auto; padding: 1rem; display: flex; flex-direction: column; }
    h1 { margin: .5rem 0; font-size: 1.8rem; }
    p { max-width: 75ch; margin: .6rem 0; }
    a { color: #174d87; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; }
    iframe { display: block; flex: 1; width: 100%; min-height: 0; margin-top: .75rem; border: 1px solid #8191a3; border-radius: .5rem; background: #23252c; }
    details { font-size: .85rem; }
    summary { cursor: pointer; }
    :focus-visible { outline: 3px solid #286eb3; outline-offset: 3px; }
    @media (max-width: 700px) {
      main { padding: .75rem; }
      h1 { font-size: 1.5rem; }
      nav { font-size: .85rem; }
      p { font-size: .9rem; }
    }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Chat links">
      <a href="/?scenario=distributed">Back to the walkthrough</a>
      <a href="http://127.0.0.1:8766/rooms/general" target="_blank" rel="noopener">Open chat directly</a>
    </nav>
    <h1>Crash a room. Keep the app running.</h1>
    <iframe src="http://127.0.0.1:8766/rooms/general" title="Live FastAPI shared room chat" referrerpolicy="same-origin"></iframe>
  </main>
</body>
</html>
