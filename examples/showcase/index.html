<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorCSS":false}'>
  <title>PyBeam showcase</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/missing.min.css">
  <link rel="stylesheet" href="/static/showcase.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/sse.js" defer></script>
</head>
<body>
<aside class="scenario-nav">
  <h1>PyBeam showcase</h1>
  <nav aria-label="Scenarios">
    {% for item in cards %}
    <a href="/?scenario={{ item.key }}" {% if item.key == card.key %}aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</aside>
<main>
  <section id="updates" hx-sse:connect="/events" hx-config='{"sse":{"pauseOnBackground":false}}'>
    <div id="job-refresh" hx-get="/jobs?scenario={{ card.key }}" hx-trigger="jobs-changed from:#updates" hx-target="#jobs" hx-swap="outerHTML" hx-sync="this:queue last"></div>
    {% include 'jobs.html' %}
  </section>
</main>
</body>
</html>
