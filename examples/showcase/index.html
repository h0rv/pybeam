<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorCSS":false}'>
  <title>PyBEAM | Scripted two-node walkthrough</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/showcase-walkthrough.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/sse.js" defer></script>
  <script src="/static/showcase-flow.js" defer></script>
</head>
<body>
<header class="scenario-nav">
  <a class="brand" href="/?scenario=distributed">PyBEAM</a>
  <nav aria-label="Showcase"><a href="/chat">Chat</a></nav>
</header>
<main>
  <section id="updates" hx-sse:connect="/events" hx-config='{"sse":{"pauseOnBackground":false}}'>
    <div id="job-refresh" hx-get="/jobs?scenario={{ card.key }}" hx-trigger="jobs-changed from:#updates" hx-target="#jobs" hx-swap="outerHTML" hx-sync="this:queue last"></div>
    {% include 'jobs.html' %}
  </section>
</main>
</body>
</html>
