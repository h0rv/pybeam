[project]
name = "fastapi-celery-original"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.163.0",
    "celery==5.7.0",
    "redis==8.1.0",
    "uvicorn==0.54.0",
    "flower==2.2.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff==0.15.2"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"]

[tool.ty.rules]
all = "error"
