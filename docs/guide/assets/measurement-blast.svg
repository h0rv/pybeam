  <path class="axis" d="M146.66666666666666 38V293"/>
  <text x="146.66666666666666" y="24" class="note" text-anchor="middle">200</text>
  <path class="axis" d="M210 38V293"/>
  <text x="210" y="24" class="note" text-anchor="middle">300</text>
  <text x="20" y="60">Process per job · 3/3 survive</text>
