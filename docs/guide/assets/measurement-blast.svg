<svg xmlns="http://www.w3.org/2000/svg" width="340" height="338" viewBox="0 0 340 338" role="img" aria-labelledby="title desc">
  <title id="title">Replacement time after one job aborts</title>
  <desc id="desc">Process per job · 3/3 survive: 80 ms. Prefork pool · 0/3 survive: 53 ms. isolated · 3/3 survive: 70 ms. Separate nodes · 3/3 survive: 254 ms. Linear axis.</desc>
  <style>
