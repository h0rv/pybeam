<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
  <title id="title">Python ergonomics, BEAM foundations</title>
  <desc id="desc">A Python application calls PyBEAM typed wrappers. The wrappers reuse erlang-python for execution and message passing and Hornbeam for optional web and shared services. BEAM/OTP provides supervisors, ETS shared state, pub/sub and mailboxes. Python still uses one interpreter and GIL.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#bda5ff"/></marker>
  </defs>
  <rect width="640" height="660" rx="16" fill="#141c2c"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="320" y="43" font-size="16" letter-spacing="3" fill="#c6b5f5">THE STACK</text>
    <rect x="32" y="68" width="576" height="88" rx="10" fill="#26344b" stroke="#7d91ae"/>
    <text x="320" y="103" font-size="25" font-weight="650" fill="#ffffff">Your Python app</text>
    <text x="320" y="133" font-size="19" fill="#d0dbea">async functions · existing web framework</text>
    <path d="M320 157V186" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="199" width="576" height="88" rx="10" fill="#392a59" stroke="#bda5ff"/>
    <text x="320" y="234" font-size="25" font-weight="650" fill="#ffffff">PyBEAM typed wrappers</text>
    <text x="320" y="264" font-size="19" fill="#e2d8fa">Python APIs · ownership · lifecycle</text>
    <path d="M320 288V305H174V323" fill="none" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M320 305H466V323" fill="none" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="336" width="280" height="110" rx="10" fill="#26344b" stroke="#7d91ae"/>
    <rect x="328" y="336" width="280" height="110" rx="10" fill="#26344b" stroke="#7d91ae"/>
    <text x="172" y="371" font-size="23" font-weight="650" fill="#ffffff">erlang-python</text>
    <text x="172" y="402" font-size="18" fill="#d0dbea">Execution · contexts</text>
    <text x="172" y="427" font-size="18" fill="#d0dbea">Message passing</text>
    <text x="468" y="371" font-size="23" font-weight="650" fill="#ffffff">Hornbeam</text>
    <text x="468" y="402" font-size="18" fill="#d0dbea">Optional web serving</text>
    <text x="468" y="427" font-size="18" fill="#d0dbea">Shared services</text>
    <path d="M172 447V475" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M468 447V475" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="488" width="576" height="100" rx="10" fill="#193c40" stroke="#79c9bc"/>
    <text x="320" y="524" font-size="25" font-weight="650" fill="#ffffff">BEAM / OTP</text>
    <text x="320" y="558" font-size="19" fill="#d2f0e8">Supervisors · ETS shared state · pub/sub · mailboxes</text>
    <text x="320" y="628" font-size="18" fill="#d0dbea">One Python interpreter / GIL. Not multicore Python.</text>
  </g>
</svg>
