<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
  <title id="title">One shared count, explicit actor recovery</title>
  <desc id="desc">Two WebSocket clients use Python handlers. Step one increments one shared BEAM counter atomically. Step two publishes an invalidation separately. Step three reads the latest value for both clients. In a separate actor lifecycle, a supervisor replaces a crashed actor with a new actor starting at zero; the app must rejoin it.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#bda5ff"/></marker></defs>
  <rect width="640" height="760" rx="16" fill="#141c2c"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="320" y="40" font-size="16" letter-spacing="3" fill="#c6b5f5">SHARE STATE, NOT PYTHON GLOBALS</text>
    <rect x="32" y="65" width="272" height="80" rx="10" fill="#26344b" stroke="#7d91ae"/>
    <rect x="336" y="65" width="272" height="80" rx="10" fill="#26344b" stroke="#7d91ae"/>
    <text x="168" y="98" font-size="23" font-weight="650" fill="#ffffff">Client A</text>
    <text x="472" y="98" font-size="23" font-weight="650" fill="#ffffff">Client B</text>
    <text x="168" y="126" font-size="18" fill="#d0dbea">WebSocket connection</text>
    <text x="472" y="126" font-size="18" fill="#d0dbea">WebSocket connection</text>
    <path d="M168 147V180" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M472 147V180" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="194" width="576" height="76" rx="10" fill="#392a59" stroke="#bda5ff"/>
    <text x="320" y="225" font-size="23" font-weight="650" fill="#ffffff">Your async Python handlers</text>
    <text x="320" y="252" font-size="18" fill="#e2d8fa">PyBEAM → Hornbeam services</text>
    <path d="M52 271V331" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M588 271V331" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="168" y="309" font-size="18" fill="#e2d8fa">1. Atomic increment</text>
    <text x="472" y="309" font-size="18" fill="#e2d8fa">2. Publish changed key</text>
    <rect x="32" y="345" width="272" height="80" rx="10" fill="#193c40" stroke="#79c9bc"/>
    <rect x="336" y="345" width="272" height="80" rx="10" fill="#193c40" stroke="#79c9bc"/>
    <text x="168" y="378" font-size="23" font-weight="650" fill="#ffffff">Shared counter</text>
    <text x="168" y="405" font-size="18" fill="#d2f0e8">One count on BEAM</text>
    <text x="472" y="378" font-size="23" font-weight="650" fill="#ffffff">Pub/sub</text>
    <text x="472" y="405" font-size="18" fill="#d2f0e8">Invalidation, not state</text>
    <path d="M472 426V455H168V427" fill="none" stroke="#79c9bc" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="320" y="486" font-size="19" fill="#d2f0e8">3. Subscribers read fresh → send to both clients</text>
    <path d="M32 515H608" stroke="#7d91ae" stroke-dasharray="5 5"/>
    <text x="320" y="548" font-size="16" letter-spacing="2" fill="#c6b5f5">A SEPARATE ACTOR LIFECYCLE</text>
    <rect x="160" y="569" width="320" height="55" rx="10" fill="#392a59" stroke="#bda5ff"/>
    <text x="320" y="604" font-size="23" font-weight="650" fill="#ffffff">OTP supervisor</text>
    <path d="M240 625V650H168V661" fill="none" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M400 625V650H472V661" fill="none" stroke="#bda5ff" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="674" width="272" height="48" rx="8" fill="#442e35" stroke="#e3a7b4"/>
    <rect x="336" y="674" width="272" height="48" rx="8" fill="#193c40" stroke="#79c9bc"/>
    <text x="168" y="705" font-size="20" fill="#ffe3e9">Actor crashed · value 5</text>
    <text x="472" y="705" font-size="20" fill="#d2f0e8">Replacement · value 0</text>
    <text x="320" y="747" font-size="17" fill="#d0dbea">Fresh constructor state. App must rejoin. No replay.</text>
  </g>
</svg>
