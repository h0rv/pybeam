<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">The PyBEAM runtime stack</title>
  <desc id="desc">One OS process runs the BEAM VM. Inside it, one BEAM scheduler preempts BEAM processes: actors and tasks, about 2.7 KB each, with a mailbox and supervisor. Worker contexts run in the main Python interpreter with shared module globals. Actor calls lease workers from a node-wide pool, each with its own OS thread and loop. Shared-loop tasks use a separate shared loop; dedicated-loop tasks own their thread and loop. Isolated tasks run outside the VM in a child OS process with its own interpreter, so a crash stays in the child.</desc>
  <style>
    svg { color: #24292f; font-family: system-ui, sans-serif; }
    rect, path { fill: none; stroke: #6e7781; stroke-width: 1.25; }
    text { fill: currentColor; font-size: 17px; }
    .heading { font-size: 19px; font-weight: 600; }
    .note { fill: #57606a; font-size: 15px; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6edf3; }
      rect, path { stroke: #8b949e; }
      .note { fill: #adb6c0; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7"/></marker>
  </defs>
  <rect x="16" y="16" width="500" height="568"/>
  <text x="36" y="46" class="heading" text-anchor="start">OS process: the BEAM VM</text>
  <text x="36" y="70" class="note" text-anchor="start">started and stopped by pybeam.run</text>
  <rect x="36" y="90" width="460" height="64"/>
  <text x="266" y="116" class="heading" text-anchor="middle">BEAM scheduler</text>
  <text x="266" y="140" class="note" text-anchor="middle">one in the managed VM · preempts BEAM processes</text>
  <path d="M266 155V173" marker-end="url(#arrow)"/>
  <rect x="36" y="185" width="460" height="64"/>
  <text x="266" y="211" class="heading" text-anchor="middle">BEAM processes</text>
  <text x="266" y="235" class="note" text-anchor="middle">actors and tasks · 2.7 KB each · mailbox, supervisor</text>
  <path d="M266 250V268" marker-end="url(#arrow)"/>
  <rect x="36" y="280" width="460" height="288"/>
  <text x="266" y="308" class="heading" text-anchor="middle">Main Python interpreter</text>
  <text x="266" y="332" class="note" text-anchor="middle">GIL on 3.14 · no GIL on 3.14t · shared module globals</text>
  <rect x="52" y="350" width="136" height="64"/>
  <text x="120" y="376" text-anchor="middle">worker context</text>
  <text x="120" y="400" class="note" text-anchor="middle">own OS thread</text>
  <rect x="198" y="350" width="136" height="64"/>
  <text x="266" y="376" text-anchor="middle">pooled worker</text>
  <text x="266" y="400" class="note" text-anchor="middle">thread, loop</text>
  <rect x="344" y="350" width="136" height="64"/>
  <text x="412" y="376" text-anchor="middle">dedicated loop</text>
  <text x="412" y="400" class="note" text-anchor="middle">own thread, loop</text>
  <path d="M120 415V445" marker-end="url(#arrow)"/>
  <path d="M266 415V445" marker-end="url(#arrow)"/>
  <rect x="52" y="457" width="136" height="92"/>
  <text x="120" y="485" class="heading" text-anchor="middle">Shared loop</text>
  <text x="120" y="509" class="note" text-anchor="middle">shared-loop</text>
  <text x="120" y="531" class="note" text-anchor="middle">tasks only</text>
  <rect x="198" y="457" width="136" height="92"/>
  <text x="266" y="485" class="heading" text-anchor="middle">Actor calls</text>
  <text x="266" y="509" class="note" text-anchor="middle">lease a worker</text>
  <text x="266" y="531" class="note" text-anchor="middle">for each call</text>
  <text x="412" y="440" class="note" text-anchor="middle">tasks only</text>
  <path d="M497 217H650V268" marker-end="url(#arrow)"/>
  <rect x="556" y="280" width="188" height="148"/>
  <text x="650" y="308" class="heading" text-anchor="middle">Isolated context</text>
  <text x="650" y="334" class="note" text-anchor="middle">child OS process</text>
  <text x="650" y="356" class="note" text-anchor="middle">own interpreter</text>
  <text x="650" y="378" class="note" text-anchor="middle">bytes copied in, out</text>
  <text x="650" y="400" class="note" text-anchor="middle">crash stays here</text>
  <text x="650" y="452" class="note" text-anchor="middle">tasks only</text>
</svg>
