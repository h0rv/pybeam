<svg xmlns="http://www.w3.org/2000/svg" width="760" height="584" viewBox="0 0 760 584" role="img" aria-labelledby="title desc">
  <title id="title">Four CPU jobs in every mode</title>
  <desc id="desc">Each row runs four jobs of 3,000,000 loop iterations. Bars show when each job ran on a shared time axis. asyncio.gather 3.14: wall 0.99 s, speedup 1.0x. asyncio.to_thread 3.14: wall 1.20 s, speedup 0.8x. asyncio.to_thread 3.14t: wall 0.42 s, speedup 2.5x. process per job 3.14: wall 0.34 s, speedup 4.9x. prefork pool 3.14: wall 0.27 s, speedup 3.7x. worker 3.14: wall 1.44 s, speedup 1.1x. worker 3.14t: wall 0.66 s, speedup 2.1x. owngil 3.14: wall 0.40 s, speedup 3.3x. isolated 3.14: wall 0.36 s, speedup 4.0x. isolated 3.14t: wall 0.53 s, speedup 2.0x. separate nodes 3.14: wall 0.35 s, speedup 3.7x.</desc>
  <style>
    svg { color: #24292f; font-family: system-ui, sans-serif; }
    rect, path { fill: none; stroke: #6e7781; stroke-width: 1.25; }
    text { fill: currentColor; font-size: 17px; }
    .heading { font-size: 19px; font-weight: 600; }
    .note { fill: #57606a; font-size: 15px; }
    .bar { fill: #57606a; stroke: none; }
    .axis { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6edf3; }
      rect, path { stroke: #8b949e; }
      .note { fill: #adb6c0; }
      .bar { fill: #adb6c0; }
      .axis { stroke: #30363d; }
    }
  </style>

