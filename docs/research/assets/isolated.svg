<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title desc">
  <title id="title">Isolated Python child processes</title>
  <desc id="desc">BEAM processes route calls to a bounded pool of isolated contexts through sockets. Each context owns a child OS process containing its own Python interpreter and execution thread. Conventional children have a GIL; tested free-threaded children do not. A native abort kills only that child, which restarts. The BEAM VM survives.</desc>
  <style>
    svg { color: #24292f; font-family: system-ui, sans-serif; text-anchor: middle; }
    rect, path { fill: none; stroke: #6e7781; stroke-width: 1.25; }
    text { fill: currentColor; font-size: 19px; }
    .heading { font-size: 23px; font-weight: 600; }
    .note { fill: #57606a; font-size: 18px; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6edf3; }
      rect, path { stroke: #8b949e; }
      .note { fill: #adb6c0; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7"/></marker>
  </defs>
  <rect x="24" y="16" width="592" height="236"/>
  <text x="320" y="49" class="heading">isolated · CPython 3.14 / 3.14t</text>
  <text x="320" y="77" class="note">BEAM OS process · survives child abort</text>
  <rect x="48" y="98" width="544" height="76"/>
  <text x="320" y="129">BEAM processes</text>
  <text x="320" y="156" class="note">Many callers · bounded context pool</text>
  <text x="320" y="222" class="note">Context owners · socket IPC</text>
  <path d="M320 253V291" marker-end="url(#arrow)"/>
  <rect x="24" y="303" width="592" height="370"/>
  <text x="320" y="338" class="heading">Child OS process</text>
  <text x="320" y="366" class="note">One per isolated context</text>
  <rect x="48" y="390" width="544" height="198"/>
  <text x="320" y="423">Separate Python interpreter</text>
  <text x="320" y="451" class="note">3.14: own GIL · 3.14t: no GIL in test</text>
  <rect x="160" y="477" width="320" height="70"/>
  <text x="320" y="505">Context execution</text>
  <text x="320" y="531" class="note">OS thread</text>
  <text x="320" y="565" class="note">Separate module state</text>
  <text x="320" y="625">os.abort() → only this child exits</text>
  <text x="320" y="651" class="note">Context survives · child restarts</text>
</svg>
