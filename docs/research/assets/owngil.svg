<svg xmlns="http://www.w3.org/2000/svg" width="640" height="550" viewBox="0 0 640 550" role="img" aria-labelledby="title desc">
  <title id="title">Own-GIL subinterpreter contexts (unsupported)</title>
  <desc id="desc">Historical unsupported mode: common native extensions refuse to load. BEAM processes call a bounded pool of contexts. Each context has an OS thread and its own subinterpreter with separate module state. Conventional Python gives each subinterpreter a GIL; the tested free-threaded build kept the GIL disabled. All contexts share the BEAM OS process. A native abort takes down the entire VM.</desc>
  <style>
    svg { color: #24292f; font-family: system-ui, sans-serif; text-anchor: middle; }
    rect, path { fill: none; stroke: #6e7781; stroke-width: 1.25; }
    text { fill: currentColor; font-size: 19px; }
    .heading { font-size: 23px; font-weight: 600; }
    .note { fill: #57606a; font-size: 18px; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6edf3; }
      rect, path { stroke: #8b949e; }
      .note { fill: #adb6c0; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7"/></marker>
  </defs>
  <rect x="24" y="16" width="592" height="518"/>
  <text x="320" y="49" class="heading">owngil · unsupported</text>
  <text x="320" y="77" class="note">One BEAM OS process</text>
  <rect x="48" y="98" width="544" height="76"/>
  <text x="320" y="129">BEAM processes</text>
  <text x="320" y="156" class="note">Many callers · bounded context pool</text>
  <path d="M178 175V204" marker-end="url(#arrow)"/>
  <path d="M462 175V204" marker-end="url(#arrow)"/>
  <rect x="48" y="216" width="260" height="230"/>
  <rect x="332" y="216" width="260" height="230"/>
  <text x="178" y="249">Subinterpreter A</text>
  <text x="462" y="249">Subinterpreter B</text>
  <text x="178" y="277" class="note">Own GIL on 3.14</text>
  <text x="462" y="277" class="note">Own GIL on 3.14</text>
  <rect x="72" y="301" width="212" height="70"/>
  <rect x="356" y="301" width="212" height="70"/>
  <text x="178" y="329">Context</text>
  <text x="178" y="355" class="note">OS thread</text>
  <text x="462" y="329">Context</text>
  <text x="462" y="355" class="note">OS thread</text>
  <text x="178" y="420" class="note">Separate state</text>
  <text x="462" y="420" class="note">Separate state</text>
  <text x="320" y="473" class="note">3.14t: GIL disabled in tested contexts</text>
  <text x="320" y="507">os.abort() → whole VM exits</text>
</svg>
