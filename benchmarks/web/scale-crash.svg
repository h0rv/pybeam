<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 253" role="img" aria-labelledby="title desc">
<title id="title">Recovery after killing the serving process</title>
<desc id="desc">Seconds from SIGKILL until the listener address can be bound, a valid HTTP response, a fresh WebSocket echo, and reconnecting all 5,000 WebSockets and checking an echo burst.</desc>
<style>
    svg { color: #202124; font-family: system-ui, sans-serif; }
    text { fill: currentColor; }
    .paper { fill: #fff; }
    .grid { stroke: #d6d9dc; }
    .mark { fill: currentColor; }
    .range { stroke: currentColor; stroke-width: 1.5; }
    .hornbeam { color: #1764a3; }
    .uvicorn-standard { color: #9a4809; }
    .granian { color: #307567; }
    @media (prefers-color-scheme: dark) {
      svg { color: #eef0f2; }
      .paper { fill: #16181a; }
      .grid { stroke: #4d5259; }
      .hornbeam { color: #8bc8ff; }
      .uvicorn-standard { color: #ffb477; }
      .granian { color: #79d7c1; }
    }
  </style>
<rect class="paper" width="704" height="253"/>
<text x="20" y="29" font-size="21" text-anchor="start" font-weight="600">Recovery after killing the serving process</text>
<g class="mark hornbeam"><circle cx="27" cy="55" r="4"/></g>
<text x="37" y="60" font-size="15" text-anchor="start" font-weight="400">Hornbeam</text>
<g class="mark uvicorn-standard"><rect x="133.00" y="51.00" width="8" height="8"/></g>
<text x="147" y="60" font-size="15" text-anchor="start" font-weight="400">Uvicorn</text>
<g class="mark granian"><path d="M247.00,50.00l5,5 -5,5 -5,-5z"/></g>
<text x="257" y="60" font-size="15" text-anchor="start" font-weight="400">Granian</text>
<text x="682" y="60" font-size="15" text-anchor="end" font-weight="400">Median and range</text>
<text x="20" y="87" font-size="15" text-anchor="start" font-weight="600">Seconds from SIGKILL</text>
<path class="grid" d="M80,217.00H682"/>
<text x="72" y="222.0" font-size="13" text-anchor="end" font-weight="400">0</text>
<path class="grid" d="M80,188.75H682"/>
<text x="72" y="193.75" font-size="13" text-anchor="end" font-weight="400">1</text>
<path class="grid" d="M80,160.50H682"/>
<text x="72" y="165.5" font-size="13" text-anchor="end" font-weight="400">2</text>
<path class="grid" d="M80,132.25H682"/>
<text x="72" y="137.25" font-size="13" text-anchor="end" font-weight="400">3</text>
<path class="grid" d="M80,104.00H682"/>
<text x="72" y="109.0" font-size="13" text-anchor="end" font-weight="400">4</text>
<text x="155.25" y="240" font-size="15" text-anchor="middle" font-weight="400">Listener free</text>
<g class="mark hornbeam"><title>hornbeam: 0.06981 (0.06673–0.06993); n=3</title><path class="range" d="M131.25,215.02V215.11"/><circle cx="131.25" cy="215.03" r="4"/></g>
<g class="mark uvicorn-standard"><title>uvicorn-standard: 0.06756 (0.04053–0.07074); n=3</title><path class="range" d="M155.25,215.00V215.86"/><rect x="151.25" y="211.09" width="8" height="8"/></g>
<g class="mark granian"><title>granian: 0.1091 (0.1086–0.1097); n=3</title><path class="range" d="M179.25,213.90V213.93"/><path d="M179.25,208.92l5,5 -5,5 -5,-5z"/></g>
<text x="305.75" y="240" font-size="15" text-anchor="middle" font-weight="400">First HTTP</text>
<g class="mark hornbeam"><title>hornbeam: 0.7238 (0.7137–0.7639); n=3</title><path class="range" d="M281.75,195.42V196.84"/><circle cx="281.75" cy="196.55" r="4"/></g>
<g class="mark uvicorn-standard"><title>uvicorn-standard: 0.4334 (0.4185–0.4357); n=3</title><path class="range" d="M305.75,204.69V205.18"/><rect x="301.75" y="200.76" width="8" height="8"/></g>
<g class="mark granian"><title>granian: 0.5278 (0.5266–0.5795); n=3</title><path class="range" d="M329.75,200.63V202.12"/><path d="M329.75,197.09l5,5 -5,5 -5,-5z"/></g>
<text x="456.25" y="240" font-size="15" text-anchor="middle" font-weight="400">First WS echo</text>
<g class="mark hornbeam"><title>hornbeam: 0.7356 (0.7266–0.7746); n=3</title><path class="range" d="M432.25,195.12V196.47"/><circle cx="432.25" cy="196.22" r="4"/></g>
<g class="mark uvicorn-standard"><title>uvicorn-standard: 0.4343 (0.4186–0.4361); n=3</title><path class="range" d="M456.25,204.68V205.18"/><rect x="452.25" y="200.73" width="8" height="8"/></g>
<g class="mark granian"><title>granian: 0.5282 (0.5272–0.5798); n=3</title><path class="range" d="M480.25,200.62V202.11"/><path d="M480.25,197.08l5,5 -5,5 -5,-5z"/></g>
<text x="606.75" y="240" font-size="15" text-anchor="middle" font-weight="400">5,000 reconnected</text>
<g class="mark hornbeam"><title>hornbeam: 2.237 (2.221–2.395); n=3</title><path class="range" d="M582.75,149.34V154.27"/><circle cx="582.75" cy="153.8" r="4"/></g>
<g class="mark uvicorn-standard"><title>uvicorn-standard: 3.152 (3.054–3.534); n=3</title><path class="range" d="M606.75,117.17V130.72"/><rect x="602.75" y="123.94" width="8" height="8"/></g>
<g class="mark granian"><title>granian: 1.307 (1.264–1.34); n=3</title><path class="range" d="M630.75,179.13V181.31"/><path d="M630.75,175.09l5,5 -5,5 -5,-5z"/></g>
</svg>
