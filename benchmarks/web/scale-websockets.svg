<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 432" role="img" aria-labelledby="title desc">
<title id="title">WebSocket echo and memory</title>
<desc id="desc">Completed ramp steps only. A cross means no repeat held the target without errors. Memory is incremental server process-tree PSS divided by held connections.</desc>
<style>
    svg { color: #202124; font-family: system-ui, sans-serif; }
    text { fill: currentColor; }
    .paper { fill: #fff; }
    .grid { stroke: #d6d9dc; }
    .mark { fill: currentColor; }
    .range { stroke: currentColor; stroke-width: 1.5; }
    .hornbeam { color: #1764a3; }
    .uvicorn-standard { color: #9a4809; }
    .granian { color: #307567; }
    @media (prefers-color-scheme: dark) {
      svg { color: #eef0f2; }
      .paper { fill: #16181a; }
      .grid { stroke: #4d5259; }
      .hornbeam { color: #8bc8ff; }
      .uvicorn-standard { color: #ffb477; }
      .granian { color: #79d7c1; }
    }
  </style>
